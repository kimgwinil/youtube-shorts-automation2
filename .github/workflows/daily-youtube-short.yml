name: Daily YouTube Short

on:
  schedule:
    - cron: "10 19 * * *"   # 04:10 KST
  workflow_dispatch:
    inputs:
      force:
        description: "오늘 이미 업로드된 경우 강제 실행 (true/false)"
        required: false
        default: "false"
      openai_health_check:
        description: "OpenAI API key and Responses API only"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  openai-health-check:
    if: github.event_name == 'workflow_dispatch' && inputs.openai_health_check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_TEXT_MODEL: gpt-5.6-luna
    steps:
      - name: Verify API key authentication
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}" || { echo "OPENAI_API_KEY is not configured"; exit 1; }
          status="$(curl -sS -o models.json -w '%{http_code}' -H "Authorization: Bearer ${OPENAI_API_KEY}" https://api.openai.com/v1/models)"
          echo "OpenAI authentication HTTP status: ${status}"
          test "${status}" = "200" || { jq -r '{type:.error.type,code:.error.code,message:.error.message}' models.json; exit 1; }
      - name: Verify Responses API and target model
        run: |
          set -euo pipefail
          status="$(curl -sS -o response.json -w '%{http_code}' -H "Authorization: Bearer ${OPENAI_API_KEY}" -H 'Content-Type: application/json' --data "$(jq -nc --arg model "${OPENAI_TEXT_MODEL}" '{model:$model,input:"Reply with exactly OK.",max_output_tokens:32,reasoning:{effort:"none"},store:false}')" https://api.openai.com/v1/responses)"
          echo "OpenAI Responses API HTTP status: ${status}"
          test "${status}" = "200" || { jq -r '{type:.error.type,code:.error.code,message:.error.message}' response.json; exit 1; }
          jq -r '{model,status,output_text:([.output[]?.content[]?|select(.type=="output_text")|.text]|join(""))}' response.json

  daily-short:
    if: github.event_name != 'workflow_dispatch' || inputs.openai_health_check != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      TZ: Asia/Seoul
      TIMEZONE_NAME: Asia/Seoul
      LOCATION_NAME: Seoul, KR
      LOCATION_LATITUDE: "37.5665"
      LOCATION_LONGITUDE: "126.9780"
      BACKGROUND_DIR: ${{ github.workspace }}/content/backgrounds
      FONT_FILE: ${{ github.workspace }}/runtime-assets/NotoSansCJKkr-Regular.otf
      YOUTUBE_CLIENT_SECRETS_FILE: ${{ github.workspace }}/secrets/client_secret.json
      YOUTUBE_TOKEN_FILE: ${{ github.workspace }}/secrets/token.json
      DEFAULT_VISIBILITY: public
      DEFAULT_CATEGORY_ID: "27"
      SHORTS_HASHTAGS: "#Shorts #쇼츠 #명언 #고전 #자기계발"
      ENABLE_AI_GENERATION: "true"
      OPENAI_TEXT_MODEL: gpt-5.6-luna
      OPENAI_IMAGE_MODEL: gpt-image-1
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NANO_BANANA_IMAGE_MODEL: gemini-3.1-flash-image
      GEMINI_IMAGE_MODEL: imagen-4.0-generate-001
      ENABLE_GEMINI_MUSIC: "true"
      GEMINI_MUSIC_MODEL: models/lyria-realtime-exp
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ENABLE_NARRATION: "true"
      NARRATION_VOICE: ko-KR-Chirp3-HD-Aoede
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      GITHUB_ACTIONS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Prepare runtime assets
        run: |
          mkdir -p runtime-assets
          curl -L https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Korean/NotoSansCJKkr-Regular.otf -o runtime-assets/NotoSansCJKkr-Regular.otf

      - name: Prepare runtime files
        env:
          CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p secrets output/generated_backgrounds output
          printf '%s' "$CLIENT_SECRET_JSON" > secrets/client_secret.json
          printf '%s' "$TOKEN_JSON" > secrets/token.json

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and upload
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          set +e
          python scripts/run_daily.py $FORCE_FLAG
          EXIT=$?
          if [ $EXIT -eq 2 ]; then
            echo "오늘 이미 처리됨 — 정상 스킵"
            exit 0
          fi
          exit $EXIT

      - name: Persist state
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update daily shorts state"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin HEAD:"$DEFAULT_BRANCH"
